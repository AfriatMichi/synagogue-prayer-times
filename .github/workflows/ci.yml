name: CI

on:
  push:
    branches: [main]
    # The poller commits to data/ and state/ every time a message is handled.
    # Those commits change no code, so they must not burn Actions minutes.
    paths-ignore:
      - 'data/**'
      - 'state/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Zero dependencies on purpose - there is nothing to install.
      - run: npm test
